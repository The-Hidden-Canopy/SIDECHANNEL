name: Verify SIDECHANNEL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node reference tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Verify reference runtime
        run: npm run verify
      - name: Assemble portable loopback bundle
        run: node scripts/package-runtime.mjs . "$RUNNER_TEMP/sidechannel-runtime"
      - name: Run bounded benchmark matrix
        run: npm run benchmark:matrix
      - name: Run SceneView benchmark receipt
        run: npm run benchmark:scene-view -- 20 9
      - name: Run bounded burst benchmark
        run: npm run benchmark:burst -- 10000 8 1024
      - name: Run software fault campaign
        run: npm run faults

  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Configure native reference core
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build native reference core
        run: cmake --build build/native --config Release --parallel
      - name: Run native tests
        run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Verify Node and native parity
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            native_exe=build/native/native/Release/sidechannel-native.exe
          else
            native_exe=build/native/native/sidechannel-native
          fi
          npm run verify:native-parity -- "$native_exe" 2
          npm run verify:native-session -- "$native_exe" 2
          npm run verify:native-export -- "$native_exe"
          npm run verify:native-roundtrip -- "$native_exe" 2
          npm run verify:native-adapter -- "$native_exe"
          npm run verify:native-sqlite -- "$native_exe" 2
          npm run verify:native-ipc-sqlite -- "$native_exe"
          npm run verify:native-ipc-scene-view -- "$native_exe"
          npm run verify:native-ipc-export -- "$native_exe"
          npm run benchmark:native -- "$native_exe" 8

  native-sanitizer:
    name: Native sanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure sanitized native reference core
        run: cmake -S . -B build/native-sanitized -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSIDECHANNEL_NATIVE_SANITIZERS=ON
      - name: Build sanitized native reference core
        run: cmake --build build/native-sanitized --parallel
      - name: Run sanitized native tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/native-sanitized --output-on-failure
